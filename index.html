<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporal Quest</title>
  <meta name="description" content="Learn Temporal by playing: Workflows, Activities, Workers, Signals, Queries, Updates, Schedules and patterns.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-lang="ts">
  <header class="top">
    <button id="menu" class="icon-btn" aria-label="Toggle menu">☰</button>
    <a class="brand" href="#/">⏳ Temporal Quest</a>
    <div class="spacer"></div>
    <div class="xpbox" title="Your progress">
      <span id="level" class="level"></span>
      <div class="xpbar"><div id="xpfill"></div></div>
      <span id="xptext" class="xptext"></span>
    </div>
    <div class="langs" role="group" aria-label="Code language">
      <button data-l="ts" class="on">TypeScript</button>
      <button data-l="py">Python</button>
    </div>
  </header>

  <div class="shell">
    <nav id="nav" aria-label="Modules"></nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/content.js"></script>
  <script src="js/deep/signals.code.js"></script>
  <script src="js/deep/signals.js"></script>
  <script src="js/deep/updates.code.js"></script>
  <script src="js/deep/updates.js"></script>
  <script src="js/deep/queries.code.js"></script>
  <script src="js/deep/queries.js"></script>
  <script src="js/deep/activities.code.js"></script>
  <script src="js/deep/activities.js"></script>
  <script src="js/deep/workflows.code.js"></script>
  <script src="js/deep/workflows.js"></script>
  <script src="js/deep/workers.code.js"></script>
  <script src="js/deep/workers.js"></script>
  <script src="js/deep/schedules.code.js"></script>
  <script src="js/deep/schedules.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
